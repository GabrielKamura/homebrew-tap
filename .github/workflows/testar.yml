# Instala a receita num Mac do GitHub a cada mudança, do jeito que um usuário instala
# (o dono não tem Homebrew no Mac dele).
name: Testar a receita

on:
  push:
  workflow_dispatch:

jobs:
  instalar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Usar esta cópia como o tap gabrielkamura/tap
        run: brew tap gabrielkamura/tap "$GITHUB_WORKSPACE"
      - name: Conferir a receita (só avisa)
        run: brew audit --cask --online gabrielkamura/tap/kamurafy || true
      - name: Instalar e desinstalar
        run: |
          brew install --cask gabrielkamura/tap/kamurafy
          test -d /Applications/Kamurafy.app
          defaults read /Applications/Kamurafy.app/Contents/Info.plist CFBundleShortVersionString
          brew uninstall --cask gabrielkamura/tap/kamurafy
          test ! -d /Applications/Kamurafy.app
